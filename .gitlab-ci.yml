# synqframe-protocol: build the libraries and run every check, on merge requests, branches and main.
# Nothing is published: media and plugin-obs build this repository in as a submodule.

stages: [test]

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # A branch with an open merge request runs as the merge request, not twice.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

linux:
  stage: test
  tags: [synqframe-test]
  interruptible: true
  image: debian:trixie-slim
  variables:
    DEBIAN_FRONTEND: noninteractive
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build libcurl4-openssl-dev > /dev/null
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
    - ninja -C build
    - build/capture-time-sei-test
    - build/ntp-sample-test
    - build/bpm-test
    - build/text-raster-test tests/fonts/manrope-700.ttf
